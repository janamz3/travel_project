{% extends 'trips/base.html' %}

{% block content %}
<div class="container mt-5">
    <h1>📋 رحلاتي</h1>

    <table class="table table-striped mt-4">
        <thead>
            <tr>
                <th>العنوان</th>
                <th>الوجهة</th>
                <th>التقييم</th>
                <th>الميزانية</th>
                <th>الإجراءات</th>
            </tr>
        </thead>
        <tbody>
            {% for trip in trips %}
            <tr>
                <td>{{ trip.title }}</td>
                <td>{{ trip.destination.name }}</td>
                <td>⭐ {{ trip.rating }}</td>
                <td>{{ trip.budget }}</td>
                <td>
                    <a href="{% url 'edit_trip' trip.pk %}" class="btn btn-sm btn-warning">✏️</a>
                    <a href="{% url 'delete_trip' trip.pk %}" class="btn btn-sm btn-danger">🗑️</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5" class="text-center">لا توجد رحلات</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <a href="{% url 'add_trip' %}" class="btn btn-success">➕ إضافة رحلة جديدة</a>
</div>
{% endblock %}
